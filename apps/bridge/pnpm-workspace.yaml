packages:
  - '.'
# The WhatsApp transport is the only thing in the repo that needs this. Baileys pulls `libsignal` from a
# git repository, which the main workspace's supply-chain guard refuses. The exception is scoped to this
# host rather than relaxed repo-wide, so nothing in packages/* can pick up a git dependency.
blockExoticSubdeps: false
allowBuilds:
  esbuild: true
  # Baileys' preinstall only asserts Node >= 20; it installs nothing.
  '@whiskeysockets/baileys': true
  # protobufjs' postinstall is a deprecation notice, not a build step, and Baileys works without it.
  protobufjs: false
